# Deploys the web app to Cloudflare on every push to main.
# Needs repository secrets: CLOUDFLARE_API_TOKEN (Workers edit permission) and CLOUDFLARE_ACCOUNT_ID.
name: Web → Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping web deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cf.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.cf.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.cf.outputs.skip != 'true'
        run: npm ci && npm run build:web
      - if: steps.cf.outputs.skip != 'true'
        run: npx wrangler@4 deploy
