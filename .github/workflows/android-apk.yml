# Builds an installable Android APK on every push to main (or manually) — no Expo account needed.
# Download it from the run's "Artifacts" section, then install on your phone.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**']

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build APK
        run: bash scripts/build-apk.sh
      - uses: actions/upload-artifact@v5
        with:
          name: hayat-apk
          path: build/hayat.apk
          if-no-files-found: error
