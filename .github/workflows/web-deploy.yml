# Deploys the web app to Cloudflare on every push to main.
# Needs repository secrets: CLOUDFLARE_API_TOKEN (Workers edit permission) and CLOUDFLARE_ACCOUNT_ID.
name: Web → Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**']

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cf
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "::notice::CLOUDFLARE_ACCOUNT_ID found" || echo "::warning::CLOUDFLARE_ACCOUNT_ID missing (wrangler will try to detect it)"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not found in repository secrets or variables — skipping web deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN found"
          fi
      - if: steps.cf.outputs.skip != 'true'
        uses: actions/checkout@v5
      - if: steps.cf.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.cf.outputs.skip != 'true'
        run: npm ci && npm run build:web
      - if: steps.cf.outputs.skip != 'true'
        run: npx wrangler@4 deploy
