# Deploys the web app to Cloudflare on every push to main.
# Needs repository secrets: CLOUDFLARE_API_TOKEN (Workers edit permission) and CLOUDFLARE_ACCOUNT_ID.
name: Web → Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**']

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cf
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "::notice::CLOUDFLARE_ACCOUNT_ID found" || echo "::warning::CLOUDFLARE_ACCOUNT_ID missing (wrangler will try to detect it)"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not found in repository secrets or variables — skipping web deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN found"
          fi
      - if: steps.cf.outputs.skip != 'true'
        uses: actions/checkout@v5
      - if: steps.cf.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.cf.outputs.skip != 'true'
        run: npm ci && npm run build:web
      - name: Resolve Cloudflare account
        if: steps.cf.outputs.skip != 'true'
        run: |
          # Clean up common paste mistakes: whitespace/newlines, quotes, "Bearer " prefix, "token" words
          raw="$CLOUDFLARE_API_TOKEN"
          clean=$(printf '%s' "$raw" | sed -E 's/^[[:space:]]*(Bearer[[:space:]]+)?//I' | grep -oE '[A-Za-z0-9_-]{30,}' | head -1)
          echo "::add-mask::$clean"
          echo "::notice::token shape: raw_len=${#raw} clean_len=${#clean} prefix=${clean:0:5} whitespace_removed=$([ "$raw" != "$clean" ] && echo yes || echo no)"
          echo "CLOUDFLARE_API_TOKEN=$clean" >> "$GITHUB_ENV"
          CLOUDFLARE_API_TOKEN="$clean"
          verify=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')
          echo "::notice::token verify: $verify"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            accounts=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
            echo "::notice::accounts: $(echo "$accounts" | jq -c '{success, count: (.result | length), errors: [.errors[]?.message]}')"
            id=$(echo "$accounts" | jq -r '.result[0].id // empty')
            if [ -n "$id" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"; fi
          fi
          exit 0
      - name: Deploy with Wrangler
        if: steps.cf.outputs.skip != 'true'
        run: |
          set +e
          npx wrangler@4 deploy 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            echo "::error::$(grep -v '^\s*$' deploy.log | tail -25 | tr '\n' ' ' | cut -c1-3000)"
            exit "$code"
          fi
          echo "::notice::$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
